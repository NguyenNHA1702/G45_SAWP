<!--
  Shared frame of every SAWP email. {{Content}} is the rendered body of the specific email (see Activation.html).
  All other {{Placeholders}} in the templates are HTML-encoded by EmailTemplateRenderer.
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>{{Subject}}</title>
</head>
<body style="margin:0;padding:24px;background:#f5f5f7;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#1e293b">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;padding:24px">
{{Content}}
    <p style="margin-top:24px">Hệ thống SAWP</p>
  </div>
  <p style="max-width:560px;margin:12px auto 0;font-size:12px;color:#64748b">Email được gửi tự động, vui lòng không trả lời.</p>
</body>
</html>
